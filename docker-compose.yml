# ============================================================
# Conduit — docker compose
#   docker compose up -d --build   →  http://localhost:8787
# 데이터(워크플로·크리덴셜·실행기록·DLQ)는 named volume 에 영속화된다.
# ============================================================
services:
  conduit:
    build: .
    image: conduit:latest
    container_name: conduit
    restart: unless-stopped
    ports:
      - "${CONDUIT_PORT:-8787}:8787"
    environment:
      NODE_ENV: production
      PORT: 8787
      TZ: ${TZ:-Asia/Seoul}
      # 컨테이너 밖에서 들어오는 요청은 로컬이 아니므로 API 키가 필요하다 (.env 에 설정)
      CONDUIT_API_KEY: ${CONDUIT_API_KEY:-}
      # 비워 두면 키가 있을 때 코드 실행이 꺼진다 (코드 노드 · JS 표현식 · 에이전트 run_code)
      CONDUIT_ALLOW_CODE: ${CONDUIT_ALLOW_CODE:-}
      # 모델 — 키 없이: 아래 ollama 서비스 (docker compose --profile local up). Claude: ANTHROPIC_API_KEY
      CONDUIT_LLM_BASE_URL: ${CONDUIT_LLM_BASE_URL:-http://ollama:11434/v1}
      CONDUIT_LLM_MODEL: ${CONDUIT_LLM_MODEL:-gemma3:4b}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # 동시 실행 상한 (큐 밀림 대응)
      CONDUIT_CONCURRENCY: ${CONDUIT_CONCURRENCY:-10}
    volumes:
      # 크리덴셜 암호화 키(.enckey)도 여기 있으므로 반드시 유지할 것
      - conduit-data:/app/server/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 키 없이 쓰는 PC 모델 — `docker compose --profile local up -d` 로 함께 뜬다.
  # 첫 기동 때 모델(gemma3:4b, 약 2.5GB)을 받는다. GPU 가 있으면 아래 deploy 주석을 풀 것.
  ollama:
    image: ollama/ollama:latest
    container_name: conduit-ollama
    profiles: ["local"]
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 3
        ollama pull ${CONDUIT_LLM_MODEL:-gemma3:4b}
        wait
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

volumes:
  conduit-data:
  ollama-models:
